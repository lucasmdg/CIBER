# Experiment Configuration Template
# Copy and modify for specific experiments

experiment:
  name: "experiment_template"
  description: "Template for reproducible experiments"
  seeds: [42, 123, 456]
  output_dir: "results"

# Override model/training params for the experiment
model:
  vocab_size: null
  context_length: 256
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 512
  dropout: 0.1
  bias: true
  positional_encoding: "learned"
  activation: "gelu"

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  max_epochs: 5
  max_steps: null
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  warmup_steps: 50
  eval_interval: 100
  eval_steps: 20
  checkpoint_interval: 500
  mixed_precision: false
  seed: 42

dataset:
  name: "tinyshakespeare"
  train_split: 0.9
  val_split: 0.05
  test_split: 0.05
  tokenizer_type: "char"
  bpe_vocab_size: 1000
