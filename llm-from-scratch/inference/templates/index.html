<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM from Scratch - Executive Playground</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        secondary: '#0f172a', // Slate 900
                        panel: '#1e293b', // Slate 800
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['Fira Code', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-secondary text-slate-300 h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white">
    
    <!-- Navbar -->
    <header class="bg-panel border-b border-slate-700 h-16 flex items-center justify-between px-6 shrink-0 z-10 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-primary/20 p-2 rounded-lg text-primary">
                <i data-lucide="cpu" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-white font-semibold tracking-wide text-lg">LLM Playground</h1>
                <p class="text-xs text-slate-400 font-medium tracking-wider">BUILT FROM SCRATCH</p>
            </div>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div class="flex items-center space-x-2 bg-slate-900/50 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></span>
                <span id="model-status" class="font-medium text-slate-200">Checking Model Status...</span>
            </div>
            <a href="https://github.com/lucasmdg/CIBER" target="_blank" class="text-slate-400 hover:text-white transition-colors flex items-center space-x-1">
                <i data-lucide="github" class="w-4 h-4"></i>
                <span>Repository</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar: Parameters -->
        <aside class="w-80 bg-panel border-r border-slate-700 p-6 flex flex-col overflow-y-auto custom-scrollbar shrink-0">
            <div class="flex items-center space-x-2 mb-6 text-white">
                <i data-lucide="sliders-horizontal" class="w-5 h-5 text-primary"></i>
                <h2 class="font-semibold text-lg">Parameters</h2>
            </div>

            <!-- Parameters Form -->
            <div class="space-y-6">
                
                <!-- Max Tokens -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label for="max_tokens" class="text-sm font-medium text-slate-200" title="Maximum number of tokens to generate.">Max Length</label>
                        <span id="max_tokens_val" class="text-xs bg-slate-900 px-2 py-1 rounded text-primary font-mono">150</span>
                    </div>
                    <input type="range" id="max_tokens" min="1" max="512" value="150" 
                           class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary"
                           oninput="document.getElementById('max_tokens_val').textContent = this.value">
                </div>

                <!-- Temperature -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label for="temperature" class="text-sm font-medium text-slate-200" title="Controls randomness: Lowering results in less random completions.">Temperature</label>
                        <span id="temperature_val" class="text-xs bg-slate-900 px-2 py-1 rounded text-primary font-mono">0.8</span>
                    </div>
                    <input type="range" id="temperature" min="0.0" max="2.0" step="0.1" value="0.8" 
                           class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary"
                           oninput="document.getElementById('temperature_val').textContent = this.value">
                </div>

                <!-- Top P -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label for="top_p" class="text-sm font-medium text-slate-200" title="Nucleus sampling threshold.">Top P</label>
                        <span id="top_p_val" class="text-xs bg-slate-900 px-2 py-1 rounded text-primary font-mono">0.9</span>
                    </div>
                    <input type="range" id="top_p" min="0.0" max="1.0" step="0.05" value="0.90" 
                           class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary"
                           oninput="document.getElementById('top_p_val').textContent = this.value">
                </div>

                <!-- Top K -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label for="top_k" class="text-sm font-medium text-slate-200" title="Only sample from the top K vocabulary tokens. 0 to disable.">Top K</label>
                        <span id="top_k_val" class="text-xs bg-slate-900 px-2 py-1 rounded text-primary font-mono">50</span>
                    </div>
                    <input type="range" id="top_k" min="0" max="100" step="1" value="50" 
                           class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary"
                           oninput="document.getElementById('top_k_val').textContent = this.value">
                </div>
            </div>
            
            <div class="mt-auto pt-8">
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Model Info</h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-slate-500">Parameters:</span>
                            <span id="info-params" class="text-slate-300 font-mono">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Vocab Size:</span>
                            <span id="info-vocab" class="text-slate-300 font-mono">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">Context:</span>
                            <span id="info-context" class="text-slate-300 font-mono">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right Content: Playground Area -->
        <section class="flex-1 flex flex-col bg-secondary p-6 overflow-hidden">
            <div class="flex-1 flex flex-col max-w-4xl w-full mx-auto space-y-4">
                
                <!-- Editor -->
                <div class="flex-1 flex flex-col bg-panel border border-slate-700 rounded-xl overflow-hidden shadow-lg transition-all focus-within:border-primary/50 focus-within:ring-1 focus-within:ring-primary/50">
                    <div class="bg-slate-900/40 border-b border-slate-700 px-4 py-2 flex items-center space-x-2 text-sm text-slate-400">
                        <i data-lucide="terminal" class="w-4 h-4"></i>
                        <span>Prompt Editor</span>
                    </div>
                    <!-- The prompt and result will be visually combined here for a seamless feel -->
                    <div class="flex-1 relative p-4 flex flex-col">
                        <textarea id="prompt" class="w-full bg-transparent text-white resize-none outline-none font-sans text-lg leading-relaxed placeholder-slate-600 custom-scrollbar flex-shrink-0" rows="3" placeholder="Write a prompt to get started...">To be, or not to be, that is the question:</textarea>
                        
                        <!-- Output Area (Appends visually to prompt) -->
                        <div id="output-wrapper" class="hidden mt-2 pt-2 border-t border-slate-700/50 flex-1 overflow-y-auto custom-scrollbar">
                            <span id="prompt-echo" class="text-slate-500 text-lg leading-relaxed whitespace-pre-wrap"></span>
                            <span id="result" class="text-primary text-lg leading-relaxed whitespace-pre-wrap font-medium"></span>
                        </div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="flex items-center justify-between pt-2">
                    <div class="text-sm text-slate-500 flex items-center space-x-2">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span>Model generates autoregressively token by token.</span>
                    </div>
                    
                    <div class="flex space-x-3">
                        <button id="clearBtn" onclick="clearOutput()" class="px-5 py-2.5 rounded-lg font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors flex items-center space-x-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            <span>Clear</span>
                        </button>
                        <button id="generateBtn" onclick="generateText()" class="px-6 py-2.5 rounded-lg font-medium text-white bg-primary hover:bg-emerald-400 border border-emerald-400/50 shadow-lg shadow-emerald-500/20 transition-all flex items-center space-x-2 active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed">
                            <i data-lucide="zap" class="w-4 h-4" id="generate-icon"></i>
                            <div class="loader hidden" id="generate-loader"></div>
                            <span id="generate-text">Generate</span>
                        </button>
                    </div>
                </div>

                <!-- Error Toast -->
                <div id="error-toast" class="hidden fixed bottom-6 right-6 bg-red-500/10 border border-red-500 text-red-500 px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 backdrop-blur-md">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    <span id="error-message" class="text-sm font-medium">An error occurred.</span>
                    <button onclick="document.getElementById('error-toast').classList.add('hidden')" class="text-red-500/70 hover:text-red-500">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

            </div>
        </section>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // On Load: Fetch Status
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                const indicator = document.getElementById('status-indicator');
                const statusText = document.getElementById('model-status');
                
                if (data.status === 'ready') {
                    indicator.classList.remove('bg-emerald-500', 'animate-pulse');
                    indicator.classList.add('bg-primary');
                    statusText.textContent = 'Model Ready';
                    
                    // Format Params
                    let params = data.params;
                    if(params > 1000000) params = (params/1000000).toFixed(1) + 'M';
                    else if(params > 1000) params = (params/1000).toFixed(1) + 'K';
                    
                    document.getElementById('info-params').textContent = params;
                    document.getElementById('info-vocab').textContent = data.vocab_size;
                    document.getElementById('info-context').textContent = data.context_length;
                } else {
                    indicator.classList.remove('bg-emerald-500', 'animate-pulse');
                    indicator.classList.add('bg-amber-500');
                    statusText.textContent = 'No Model Loaded';
                }
            } catch (err) {
                console.error("Failed to fetch status", err);
                const indicator = document.getElementById('status-indicator');
                indicator.classList.remove('bg-emerald-500', 'animate-pulse');
                indicator.classList.add('bg-red-500');
                document.getElementById('model-status').textContent = 'Server Offline';
            }
        });

        function clearOutput() {
            document.getElementById('prompt').value = '';
            document.getElementById('output-wrapper').classList.add('hidden');
            document.getElementById('prompt').style.display = 'block';
            document.getElementById('result').textContent = '';
            document.getElementById('prompt').focus();
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-message').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 5000);
        }

        async function generateText() {
            const promptEl = document.getElementById('prompt');
            const prompt = promptEl.value;
            if(!prompt.trim()) return;

            const maxTokens = document.getElementById('max_tokens').value;
            const temp = document.getElementById('temperature').value;
            const topP = document.getElementById('top_p').value;
            const topK = document.getElementById('top_k').value;
            
            const resultBox = document.getElementById('result');
            const promptEcho = document.getElementById('prompt-echo');
            const outputWrapper = document.getElementById('output-wrapper');
            
            const btn = document.getElementById('generateBtn');
            const btnIcon = document.getElementById('generate-icon');
            const btnLoader = document.getElementById('generate-loader');
            const btnText = document.getElementById('generate-text');

            // UI State: Loading
            btn.disabled = true;
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            btnText.textContent = 'Generating...';
            
            promptEl.style.display = 'none';
            outputWrapper.classList.remove('hidden');
            promptEcho.textContent = prompt;
            resultBox.textContent = '';
            resultBox.classList.add('animate-pulse');

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        max_tokens: maxTokens,
                        temperature: temp,
                        top_p: topP,
                        top_k: topK
                    })
                });
                
                const data = await response.json();
                resultBox.classList.remove('animate-pulse');
                
                if (response.ok) {
                    // Extract only the generated part if it contains the prompt
                    let output = data.result;
                    if(output.startsWith(prompt)) {
                        output = output.substring(prompt.length);
                    }
                    resultBox.textContent = output;
                } else {
                    showError(data.error || 'Server error occurred.');
                    promptEl.style.display = 'block';
                    outputWrapper.classList.add('hidden');
                }
            } catch (err) {
                resultBox.classList.remove('animate-pulse');
                showError('Network request failed. Is the server running?');
                promptEl.style.display = 'block';
                outputWrapper.classList.add('hidden');
            }
            
            // UI State: Reset
            btn.disabled = false;
            btnIcon.classList.remove('hidden');
            btnLoader.classList.add('hidden');
            btnText.textContent = 'Generate';
        }
    </script>
</body>
</html>
